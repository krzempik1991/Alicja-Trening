<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#1d4ed8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alicja">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Alicja Trening</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f2ed;--sf:#fff;--sf2:#f0ede8;--bd:#e2ddd6;
  --tx:#1a1714;--tx2:#6b6560;--tx3:#a09890;
  --bl:#1d4ed8;--bl-l:#eff6ff;--bl-m:#bfdbfe;
  --am:#92400e;--am-l:#fef3c7;
  --ro:#9f1239;--ro-l:#fce7f3;
  --gr:#166534;--gr-l:#dcfce7;
  --pu:#6d28d9;--pu-l:#ede9fe;
  --or:#c2410c;--or-l:#fff7ed;
  --r:12px;--rl:18px;
  --sab:env(safe-area-inset-bottom,0px);
  --sat:env(safe-area-inset-top,0px);
}
body.dark{
  --bg:#0f1117;--sf:#1a1d27;--sf2:#22263a;--bd:#2e3348;
  --tx:#e8eaf6;--tx2:#9fa8c4;--tx3:#5c6380;
  --bl:#6c8ff7;--bl-l:#1a2240;--bl-m:#2e4080;
  --am-l:#2a1f00;--ro-l:#2a0a14;--gr-l:#0a1f0e;--pu-l:#1a1030;--or-l:#1f1000;
}
/* ── DARK MODE TOGGLE ── */
.dm-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:var(--sf2);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s}
/* ── TIMER OVERLAY ── */
#timerOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;align-items:center;justify-content:center;flex-direction:column;gap:16px;backdrop-filter:blur(6px)}
#timerOverlay.on{display:flex}
#timerRing{width:200px;height:200px;position:relative}
#timerRing svg{transform:rotate(-90deg)}
#timerRing circle.bg{fill:none;stroke:var(--bd);stroke-width:8}
#timerRing circle.fg{fill:none;stroke:var(--bl);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .9s linear}
#timerNum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'DM Serif Display',serif;font-size:52px;color:#fff}
#timerLabel{color:#fff;font-size:13px;opacity:.7;letter-spacing:.06em;text-transform:uppercase}
#timerBtns{display:flex;gap:12px}
.t-btn{padding:10px 24px;border-radius:var(--r);border:none;font-size:14px;font-family:'DM Sans',sans-serif;font-weight:600;cursor:pointer}
.t-btn-stop{background:#fff;color:#111}
.t-btn-add{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3)}
/* ── TIMER BADGE on set row ── */
.tmr-btn{background:none;border:none;cursor:pointer;font-size:18px;padding:0 4px;line-height:1;opacity:.5;transition:opacity .15s;flex-shrink:0}
.tmr-btn:active,.tmr-btn:hover{opacity:1}
/* ── LONG PRESS HINT ── */
.lp-hint{font-size:10px;color:var(--tx3);margin-top:2px;font-style:italic}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
/* ── HEADER ── */
.hd{background:var(--sf);border-bottom:1px solid var(--bd);padding-left:1.5rem;padding-right:1.5rem;padding-bottom:0;padding-top:env(safe-area-inset-top);display:flex;align-items:stretch;gap:1.5rem;position:sticky;top:0;z-index:50;min-height:calc(56px + env(safe-area-inset-top))}
.logo{font-family:'DM Serif Display',serif;font-size:22px;color:var(--bl);white-space:nowrap;padding-bottom:10px;margin-top:auto}
.logo s{color:var(--tx3);font-size:13px;font-family:'DM Sans',sans-serif;font-weight:400;margin-left:6px;text-decoration:none;display:inline}
nav{display:flex;flex:1;align-items:flex-end;padding-bottom:2px}
.nb{padding:0 1.2rem;height:40px;margin-top:auto;border:none;background:transparent;cursor:pointer;font-size:13px;font-family:'DM Sans',sans-serif;font-weight:500;color:var(--tx2);border-bottom:2px solid transparent;transition:color .15s,border-color .15s;white-space:nowrap}
.nb:hover{color:var(--tx)}
.nb.on{color:var(--bl);border-bottom-color:var(--bl)}
.hs{margin-left:auto;display:flex;gap:1.25rem;align-items:center;padding-bottom:8px;margin-top:auto}
.hv{font-size:18px;font-weight:600;color:var(--bl)}
.hl{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.04em}
/* ── MAIN ── */
.main{max-width:1400px;margin:0 auto;padding:1.5rem}
.sec{display:none}.sec.on{display:block}
/* ── ATLAS CARDS (rezerwa stylowa) ── */
.eg{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.ec{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);padding:1.125rem;cursor:pointer;transition:border-color .15s;-webkit-user-select:none;user-select:none}
.ec:active{background:var(--sf2)}
@media(hover:hover){.ec:hover{border-color:var(--bl-m)}}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;letter-spacing:.03em;text-transform:uppercase}
.bp{background:var(--am-l);color:var(--am)}.bu{background:var(--bl-l);color:var(--bl)}.bc{background:var(--gr-l);color:var(--gr)}.bd{background:var(--pu-l);color:var(--pu)}
.badge-opt{display:inline-block;font-size:10px;font-weight:700;padding:2px 9px;border-radius:999px;letter-spacing:.04em;text-transform:uppercase;background:var(--or-l);color:var(--or);margin-left:6px;vertical-align:middle}
.en{font-family:'DM Serif Display',serif;font-size:15px;line-height:1.3;margin:8px 0 10px}
.ep{display:flex;gap:5px;flex-wrap:wrap}
.ep span{font-size:12px;padding:3px 9px;background:var(--sf2);border-radius:999px;color:var(--tx2)}
.ep strong{color:var(--tx);font-weight:600}
.em{font-size:11px;color:var(--tx3);margin-top:7px;font-style:italic}
.pf{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:500;padding:2px 7px;border-radius:999px;white-space:nowrap}
.pf.l{background:var(--am-l);color:var(--am)}.pf.z{background:var(--ro-l);color:var(--ro)}
/* ── MODAL ── */
.mb{display:none;position:fixed;inset:0;background:rgba(26,23,20,.55);z-index:200;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.mb.on{display:flex}
.md{background:var(--sf);border-radius:var(--rl) var(--rl) 0 0;width:100%;max-width:700px;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative;padding:1.25rem 1.25rem calc(1.5rem + var(--sab));padding-top:max(1.25rem, env(safe-area-inset-top))}
.md::before{content:'';display:block;width:40px;height:4px;background:var(--bd);border-radius:2px;margin:0 auto 1rem}
.mc{position:absolute;top:calc(max(1.25rem, env(safe-area-inset-top)) + 0.25rem);right:1.25rem;width:34px;height:34px;border:1px solid var(--bd);border-radius:50%;background:var(--sf2);cursor:pointer;font-size:20px;line-height:34px;text-align:center;color:var(--tx2);z-index:10}
.md h2{font-family:'DM Serif Display',serif;font-size:20px;margin:6px 0 3px;padding-right:2.5rem;line-height:1.3}
.mmt{font-size:12px;color:var(--tx3);font-style:italic;margin-bottom:.875rem}
.mt{display:flex;border-bottom:1px solid var(--bd);margin-bottom:.875rem;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:0;scrollbar-width:none}
.mt::-webkit-scrollbar{display:none}
.mt button{padding:.55rem .9rem;font-size:13px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--tx2);border-bottom:2px solid transparent;font-family:'DM Sans',sans-serif;white-space:nowrap;flex-shrink:0}
.mt button.on{color:var(--bl);border-bottom-color:var(--bl)}
.tp{display:none}.tp.on{display:block}
.sl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);margin:1rem 0 .4rem}
.tb{background:var(--bl-l);border:1px solid var(--bl-m);border-radius:var(--r);padding:.8rem .9rem;font-size:13.5px;color:#1e40af;line-height:1.6}
.wb{background:var(--ro-l);border:1px solid #fecdd3;border-radius:var(--r);padding:.8rem .9rem;font-size:13.5px;color:var(--ro);line-height:1.6}
.sl-list{list-style:none;counter-reset:s}
.sl-list li{counter-increment:s;padding:9px 0 9px 2.5rem;position:relative;font-size:13.5px;line-height:1.6;border-bottom:1px solid var(--bd);color:var(--tx2)}
.sl-list li:last-child{border-bottom:none}
.sl-list li::before{content:counter(s);position:absolute;left:0;top:9px;width:22px;height:22px;background:var(--bl-l);color:var(--bl);border-radius:50%;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.mc-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.mc-chip{font-size:12px;padding:4px 11px;background:var(--gr-l);color:var(--gr);border-radius:999px;font-weight:500}
/* ── PLAN ── */
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;flex-wrap:wrap;gap:10px}
.ph h2{font-family:'DM Serif Display',serif;font-size:24px}
.ws{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.wb2{padding:5px 14px;border:1px solid var(--bd);border-radius:var(--r);font-size:13px;font-weight:500;cursor:pointer;background:var(--sf);color:var(--tx2);font-family:'DM Sans',sans-serif;min-height:36px}
.wb2.on{background:var(--bl);color:#fff;border-color:var(--bl)}
.db-wrap{display:flex;flex-direction:column;gap:14px}
.db{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);overflow:hidden}
.dbh{display:flex;align-items:center;gap:10px;padding:.875rem 1.125rem;border-bottom:1px solid var(--bd);cursor:pointer;-webkit-user-select:none;user-select:none}
.dbh:active{background:var(--sf2)}
.di{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.di.push{background:var(--am-l)}.di.pull{background:var(--bl-l)}
.dt{font-family:'DM Serif Display',serif;font-size:17px;flex:1}
.dm{font-size:11px;color:var(--tx3)}
.dc{font-size:20px;color:var(--tx3);transition:transform .2s;line-height:1;flex-shrink:0}
.db.open .dc{transform:rotate(90deg)}
.dbd{display:none}.db.open .dbd{display:block}
.pt{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.plan{width:100%;border-collapse:collapse;min-width:720px}
table.plan th{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--tx3);padding:9px 11px;text-align:left;border-bottom:1px solid var(--bd);background:var(--sf2);white-space:nowrap}
table.plan td{padding:10px 11px;font-size:13.5px;border-bottom:1px solid var(--bd);vertical-align:middle}
table.plan tr:last-child td{border-bottom:none}
.rc td{background:#f0fdf4!important}.rd td{background:#faf5ff!important}
body.dark .rc td{background:#0a1f0e!important}.dark .rd td{background:#1a1030!important}
body.dark .dj-core-bg{background:#0a1f0e!important;color:var(--tx)}
body.dark .dj-card-bg{background:#1a1030!important;color:var(--tx)}
.el{font-family:'DM Serif Display',serif;font-size:14px;color:var(--tx);cursor:pointer;display:flex;align-items:center;gap:4px}
.el:active{color:var(--bl)}
@media(hover:hover){.el:hover{color:var(--bl)}}
.eli{font-size:10px;opacity:.4}
.ri{display:flex;gap:3px;align-items:center}
.ri input{width:52px;padding:6px 5px;border:1px solid var(--bd);border-radius:8px;font-size:16px;font-family:'DM Sans',sans-serif;background:var(--sf);color:var(--tx);text-align:center;-webkit-appearance:none;appearance:none}
.ri input:focus{outline:none;border-color:var(--bl)}
.ri input.f{border-color:var(--bl-m);background:var(--bl-l)}
.ru{font-size:10px;color:var(--tx3);font-weight:600}
/* ── PROGRESS ── */
.prh{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;flex-wrap:wrap;gap:10px}
.prh h2{font-family:'DM Serif Display',serif;font-size:24px}
.ss{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.25rem}
.sc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:.875rem 1rem;text-align:center}
.sv{font-size:20px;font-weight:600;color:var(--bl)}
.sk{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
.ps{margin-bottom:1.75rem}
.pt2{font-family:'DM Serif Display',serif;font-size:19px;margin-bottom:10px;padding-bottom:7px;border-bottom:2px solid var(--bd)}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pcard{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);padding:1.125rem}
.pcard h4{font-family:'DM Serif Display',serif;font-size:14px;margin-bottom:9px;line-height:1.3}
.pw{display:flex;gap:4px}
.pwc{flex:1;border:1px solid var(--bd);border-radius:8px;padding:7px 3px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.pwl{font-size:9px;font-weight:700;text-transform:uppercase;color:var(--tx3);letter-spacing:.04em;line-height:1.2}
.pwkg{font-size:12px;font-weight:600;color:var(--tx);margin-top:2px;line-height:1.2}
.pwarrow{font-size:11px;height:16px;line-height:16px;display:flex;align-items:center;justify-content:center}
.pwr{font-size:10px;color:var(--tx3);line-height:1.2}
.pwc.hd2{border-color:var(--bl-m);background:var(--bl-l)}
.pwc.hd2 .pwkg{color:var(--bl)}
.tu{color:var(--gr)}.td2{color:var(--ro)}
/* ── BUTTONS ── */
.btn{padding:8px 16px;border-radius:var(--r);font-size:13px;font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer;border:1px solid var(--bd);background:var(--sf);color:var(--tx);min-height:38px}
.btn-p{background:var(--bl);color:#fff;border-color:var(--bl)}
.btn-s{padding:5px 12px;font-size:12px;min-height:32px}
.btn-d{color:var(--ro);border-color:#fecdd3}
/* ── TOAST ── */
.toast{position:fixed;bottom:calc(16px + var(--sab));right:1rem;background:var(--tx);color:#fff;padding:9px 16px;border-radius:var(--r);font-size:13px;z-index:999;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100vw - 2rem)}
.toast.on{opacity:1;transform:translateY(0)}
/* ── MISC ── */
.es{text-align:center;padding:3rem 1.5rem;color:var(--tx3)}
.es .big{font-family:'DM Serif Display',serif;font-size:26px;color:var(--tx2);margin-bottom:.4rem}
/* ── MOBILE ── */
@media(max-width:900px){.ss{grid-template-columns:repeat(2,1fr)}.eg{grid-template-columns:1fr}}
@media(max-width:600px){
  .hd{padding:0 1rem;gap:1rem}
  .logo s{display:none}
  .hs{gap:.75rem}
  .hs-week{display:none}
  nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--sf);border-top:1px solid var(--bd);height:auto;padding-bottom:var(--sab)}
  .nb{flex:1;padding:6px 1px 8px;font-size:8px;border-bottom:none;border-top:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.2;height:auto}
  .nb.on{border-top-color:var(--bl);color:var(--bl);border-bottom:none}
  .nb::before{font-size:18px;line-height:1;display:block}
  .nb:nth-child(1)::before{content:"📋"}.nb:nth-child(2)::before{content:"📓"}.nb:nth-child(3)::before{content:"📈"}.nb:nth-child(4)::before{content:"📏"}
  .main{padding:.875rem .875rem calc(60px + var(--sab) + .875rem)}
  .ph{flex-direction:column;align-items:flex-start}
  .ws{width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:3px;scrollbar-width:none}.ws::-webkit-scrollbar{display:none}
  .wb2{flex-shrink:0}
  .mb{align-items:flex-end}
  .md{border-radius:var(--rl) var(--rl) 0 0;max-height:94vh}
  .ss{grid-template-columns:repeat(2,1fr);gap:8px}
  .pg{grid-template-columns:1fr}
  .toast{bottom:calc(60px + var(--sab) + 6px);right:.875rem;left:.875rem;text-align:center}
  .btn{min-height:44px}
  .pwkg{font-size:11px;line-height:1.2}
  table.plan td,table.plan th{padding:8px 8px}
  .mbh-plan{display:none}
}
@media(max-width:380px){
  .dt{font-size:14px}.nb{font-size:8px}
}

/* ── PROGRESS v2 ── */
.prg-ex-block{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);overflow:hidden;margin-bottom:10px}
.prg-ex-header{display:flex;align-items:center;gap:10px;padding:.875rem 1.125rem;cursor:pointer;-webkit-user-select:none;user-select:none}
.prg-ex-header:active{background:var(--sf2)}
.prg-ex-name{font-family:'DM Serif Display',serif;font-size:15px;flex:1;line-height:1.3}
.prg-ex-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;flex-shrink:0}
.prg-ex-badge.up{background:var(--gr-l);color:var(--gr)}
.prg-ex-badge.dn{background:var(--ro-l);color:var(--ro)}
.prg-ex-badge.eq{background:var(--sf2);color:var(--tx3)}
.prg-ex-badge.none{background:var(--sf2);color:var(--tx3)}
.prg-ex-body{display:none;border-top:1px solid var(--bd)}
.prg-ex-block.open .prg-ex-body{display:block}
.prg-ex-block.open .prg-chevron{transform:rotate(90deg)}
.prg-chevron{font-size:18px;color:var(--tx3);transition:transform .2s;flex-shrink:0}
.prg-week-table{width:100%;border-collapse:collapse}
.prg-week-table tr{border-bottom:1px solid var(--bd)}
.prg-week-table tr:last-child{border-bottom:none}
.prg-week-table td{padding:10px 1.125rem;font-size:13.5px;vertical-align:middle}
.prg-week-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;width:36px;color:var(--tx3)}
.prg-week-main{font-weight:600;color:var(--tx);min-width:70px}
.prg-week-reps{font-size:12px;color:var(--tx3);padding-left:4px}
.prg-week-delta{font-size:12px;font-weight:600;text-align:right;width:80px}
.prg-week-delta.up{color:var(--gr)}
.prg-week-delta.dn{color:var(--ro)}
.prg-week-delta.eq{color:var(--tx3)}
.prg-week-table tr.half-break td{border-top:2px solid var(--bl-m)}
.prg-week-table tr.no-data td{opacity:.35}
.prg-day-hd{display:flex;align-items:center;gap:10px;padding:.75rem 1.125rem;cursor:pointer;border-bottom:1px solid var(--bd);-webkit-user-select:none;user-select:none}
.prg-day-hd:active{background:var(--sf2)}
html{overscroll-behavior:none}
.md,.dbd,.pt,.ws,.mt{overscroll-behavior:contain}
</style>
</head>
<body>
<div class="hd">
  <div class="logo">Alicja <s>Trening</s></div>
  <nav>
    <button class="nb on" onclick="nav('plan',this)">Plan</button>
    <button class="nb" onclick="nav('dziennik',this)">Dziennik</button>
    <button class="nb" onclick="nav('progress',this)">Postępy</button>
    <button class="nb" onclick="nav('pomiary',this)">Pomiary</button>
  </nav>
  <div class="hs">
    <button class="dm-btn" onclick="toggleDark()" id="dmBtn" title="Tryb ciemny">🌙</button>
    <div class="hs-week"><div class="hv" id="hW">T1</div><div class="hl">Tydzień</div></div>
  </div>
</div>

<div class="main">

<!-- PLAN -->
<div class="sec on" id="s-plan">
  <div class="ph">
    <h2>Plan Treningowy</h2>
    <div class="ws">
      <button class="wb2 on" onclick="swPlan(1,this)">T1</button>
      <button class="wb2" onclick="swPlan(2,this)">T2</button>
      <button class="wb2" onclick="swPlan(3,this)">T3</button>

// ── TIMER ──
let timerSec=0,timerTotal=0,timerInt=null;
const CIRC=2*Math.PI*88;

function timerStart(secs){
  timerStop();
  timerSec=secs; timerTotal=secs;
  document.getElementById('timerOverlay').classList.add('on');
  renderTimer();
  timerInt=setInterval(function(){
    timerSec--;
    if(timerSec<=0){
      timerSec=0; renderTimer(); timerStop();
      if(navigator.vibrate) navigator.vibrate([200,100,200]);
      showToast('✅ Czas na serię!');
    } else { renderTimer(); }
  },1000);
}

function renderTimer(){
  const el=document.getElementById('timerNum');
  const arc=document.getElementById('timerArc');
  const m=Math.floor(timerSec/60), s=timerSec%60;
  el.textContent=(timerSec>0?(m>0?m+':'+(s<10?'0':'')+s:s):'GO!');
  const pct=timerTotal>0?timerSec/timerTotal:0;
  arc.style.strokeDashoffset=(CIRC*(1-pct)).toFixed(1);
  arc.style.stroke=timerSec<=10?'#ef4444':timerSec<=30?'#f59e0b':'var(--bl)';
}

function timerStop(){
  clearInterval(timerInt); timerInt=null;
  document.getElementById('timerOverlay').classList.remove('on');
}

function timerAdd(s){timerSec+=s;timerTotal=Math.max(timerTotal,timerSec);renderTimer();}
function timerOverlayClick(e){if(e.target===document.getElementById('timerOverlay'))timerStop();}

function parseRestSecs(restStr){
  if(!restStr||restStr==='–') return 90;
  const p=restStr.split(':');
  if(p.length===2) return parseInt(p[0])*60+parseInt(p[1]);
  return parseInt(restStr)||90;
}

// ── LONG PRESS (copy last week) ──
let lpTimer=null;

function lpStart(exId,sNum,week,e){
  e.preventDefault();
  lpTimer=setTimeout(function(){
    lpTimer=null;
    copyPrevWeek(exId,sNum,week);
  },600);
}

function lpEnd(){
  if(lpTimer){clearTimeout(lpTimer);lpTimer=null;}
}

function copyPrevWeek(exId,sNum,week){
  if(week<=1){showToast('Brak danych z poprzedniego tygodnia');return;}
  const prev=RES[sk(exId,week-1,sNum)]||{};
  if(!prev.kg&&!prev.reps){showToast('Brak danych z T'+(week-1));return;}
  const k=sk(exId,week,sNum);
  if(!RES[k]) RES[k]={kg:'',reps:'',date:''};
  if(prev.kg) RES[k].kg=prev.kg;
  if(prev.reps) RES[k].reps=prev.reps;
  RES[k].date=new Date().toLocaleDateString('pl-PL');
  localStorage.setItem('krt6v2',JSON.stringify(RES));
  patchSetInputs(exId,sNum,week,RES[k]);
  showToast('📋 Skopiowano z T'+(week-1)+' → T'+week);
}

function patchSetInputs(exId,sNum,week,data){
  const container=document.getElementById('dayBlocks');
  if(!container) return;
  const spans=container.querySelectorAll('span[ontouchstart]');
  for(let i=0;i<spans.length;i++){
    const attr=spans[i].getAttribute('ontouchstart')||'';
    const re=new RegExp("lpStart\\('"+exId+"',"+sNum+","+week+",");
    if(re.test(attr)){
      const row=spans[i].parentElement;
      const inputs=row.querySelectorAll('input');
      if(inputs[0]&&data.kg){
        inputs[0].value=data.kg;
        inputs[0].classList.add('f');
      }
      if(inputs[1]&&data.reps){
        inputs[1].value=data.reps;
        inputs[1].classList.add('f');
      }
      break;
    }
  }
}

// ── SAVE ──
function saveKg(id,week,setNum,inp){
  const raw=inp.value.replace(',','.');
  const num=parseFloat(raw);
  if(inp.value!==''&&isNaN(num)){inp.value='';inp.classList.remove('f');return;}
  const val=isNaN(num)?'':String(Math.round(num*100)/100);
  inp.value=val;
  inp.classList.toggle('f',!!val);
  const k=sk(id,week,setNum);
  if(!RES[k]) RES[k]={kg:'',reps:'',date:''};
  RES[k].kg=val;
  RES[k].date=new Date().toLocaleDateString('pl-PL');
  localStorage.setItem('krt6v2',JSON.stringify(RES));
  showToast('💾 S'+setNum+' · T'+week);
}

function saveS(id,week,setNum,field,inp){
  const k=sk(id,week,setNum);
  if(!RES[k]) RES[k]={kg:'',reps:'',date:''};
  RES[k][field]=inp.value;
  RES[k].date=new Date().toLocaleDateString('pl-PL');
  inp.classList.toggle('f',!!inp.value);
  localStorage.setItem('krt6v2',JSON.stringify(RES));
  showToast('💾 S'+setNum+' · T'+week);
}

function savePm(field,week,inp){
  const k=pmKey(field,week);
  const val=inp.value;
  if(val){
    RES[k]={val:val,date:new Date().toLocaleDateString('pl-PL')};
  } else {
    delete RES[k];
  }
  inp.classList.toggle('f',!!val);
  localStorage.setItem('krt6v2',JSON.stringify(RES));
  showToast('💾 Pomiar T'+week);
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('on');
  clearTimeout(t._t);
  t._t=setTimeout(function(){t.classList.remove('on');},1800);
}

// ── WEEK BEST (for progress) ──
function weekBest(id,week){
  const ex=EX.find(e=>e.id===id);
  if(!ex) return {maxKg:null,reps:null,filled:false};
  const n=parseInt(ex.weeks[week-1].s)||1;
  let maxKg=null,totalReps=0,filled=false;
  for(let i=1;i<=n;i++){
    const r=RES[sk(id,week,i)]||{};
    if(r.kg||r.reps) filled=true;
    const kg=parseFloat(r.kg);
    const rp=parseInt(r.reps)||0;
    if(!isNaN(kg)&&kg>0){
      if(maxKg===null||kg>maxKg) maxKg=kg;
      totalReps+=rp;
    }
  }
  return {maxKg:maxKg,reps:totalReps||null,filled:filled};
}

      for(var w=1;w<=5;w++){const wb=weekBest(e.id,w);if(wb.filled)return true;}
      return false;
    }).length;

    const exerciseBlocks=exs.map(function(e,idx){
      const weeks=[1,2,3,4,5].map(function(w){
        const wb=weekBest(e.id,w);
        const prev=w>1?weekBest(e.id,w-1):{maxKg:null,reps:null,filled:false};
        const ex2=EX.find(function(x){return x.id===e.id;});
        const nSets=ex2?parseInt(ex2.weeks[w-1].s)||1:1;
        const setRows=[];
        for(var i=1;i<=nSets;i++){
          const r=RES[sk(e.id,w,i)]||{};
          const rp=w>1?RES[sk(e.id,w-1,i)]||{}:{};
          setRows.push({s:i,r:r,rp:rp,hasData:!!(r.kg||r.reps)});
        }
        let delta=null,deltaDir='eq';
        if(wb.maxKg!==null&&prev.maxKg!==null){
          delta=wb.maxKg-prev.maxKg;
          deltaDir=delta>0?'up':delta<0?'dn':'eq';
        }
        return {w:w,wb:wb,prev:prev,delta:delta,deltaDir:deltaDir,nSets:nSets,setRows:setRows};
      });

      let lastFilled=null;
      for(var w=5;w>=1;w--){if(weeks[w-1].wb.filled){lastFilled=weeks[w-1];break;}}
      let headerBadge='';
      if(lastFilled&&lastFilled.delta!==null){
        headerBadge='<span class="prg-ex-badge '+lastFilled.deltaDir+'">'+
          (lastFilled.deltaDir==='up'?'↑ ':lastFilled.deltaDir==='dn'?'↓ ':'→ ')+
          Math.abs(lastFilled.delta).toFixed(Math.abs(lastFilled.delta)%1===0?0:1).replace(/\.0$/,'')+' kg</span>';
      } else if(!lastFilled){
        headerBadge='<span class="prg-ex-badge none">Brak danych</span>';
      }

      const weekRows=weeks.map(function(wk){
        const isHalf=wk.w===3;
        const noData=!wk.wb.filled;
        let deltaHtml='';
        if(wk.delta!==null){
          const absDelta=Math.abs(wk.delta);
          const formatted=(wk.delta>0?'+':'')+wk.delta.toFixed(absDelta%1===0?0:1).replace(/\.0$/,'')+'&thinsp;kg';
          deltaHtml='<span class="prg-week-delta '+wk.deltaDir+'">'+formatted+'</span>';
        } else {
          deltaHtml='<span class="prg-week-delta eq">—</span>';
        }
        const setsHtml=wk.setRows.map(function(sr){
          if(!sr.hasData) return '';
          let diff='';
          if(sr.r.kg&&sr.rp.kg){
            const d=parseFloat(sr.r.kg)-parseFloat(sr.rp.kg);
            if(!isNaN(d)&&d!==0){
              diff='<span style="font-size:10px;color:'+(d>0?'var(--gr)':'var(--ro)')+';">'+(d>0?'+':'')+d.toFixed(d%1===0?0:1).replace(/\.0$/,'')+'</span>';
            }
          }
          return '<span style="font-size:11px;color:var(--tx2);margin-right:6px">S'+sr.s+': '+(sr.r.kg?sr.r.kg+' kg':'–')
            +diff+(sr.r.reps?' ×'+sr.r.reps:'')+'</span>';
        }).join('');

        return '<tr class="'+(isHalf?'half-break':'')+(noData?' no-data':'')+'">'+
          '<td class="prg-week-label">T'+wk.w+'</td>'+
          '<td>'+
            '<div class="prg-week-main">'+(wk.wb.maxKg!==null?wk.wb.maxKg+' kg':'—')+'</div>'+
            (setsHtml?'<div style="margin-top:2px">'+setsHtml+'</div>':'')+
          '</td>'+
          '<td class="prg-week-reps">'+(wk.wb.reps?'×'+wk.wb.reps:'')+'</td>'+
          '<td>'+deltaHtml+'</td>'+
          '</tr>';
      }).join('');

      const uid='prg2-'+e.id;
      return '<div class="prg-ex-block" id="'+uid+'">'
        +'<div class="prg-ex-header" onclick="togPrgEx(\''+uid+'\')">'
        +'<div class="prg-ex-name">'+e.name+'</div>'
        +headerBadge
        +'<span class="prg-chevron">›</span>'
        +'</div>'
        +'<div class="prg-ex-body">'
        +'<table class="prg-week-table">'+weekRows+'</table>'
        +'</div></div>';
    }).join('');

    return '<div class="db" id="prg-'+day.id+'" style="margin-bottom:14px">'
      +'<div class="dbh" onclick="togPrg(\''+day.id+'\')">'
      +'<div class="di '+day.ic+'">'+day.icon+'</div>'
      +'<div style="flex:1"><div class="dt">'+day.label+optBadge(day)+'</div>'
      +'<div class="dm">'+exs.length+' ćwiczeń'+(filledCount?' · '+filledCount+' z danymi':'')+'</div></div>'
      +'<span class="dc">›</span></div>'
      +'<div class="dbd" style="padding:.875rem">'+exerciseBlocks+'</div></div>';
  }).join('');
}

function togPrgEx(uid){
  const b=document.getElementById(uid);
  b.classList.toggle('open');
}

function togPrg(id){
  const b=document.getElementById('prg-'+id);
  b.classList.toggle('open');
  b.querySelector('.dc').style.transform=b.classList.contains('open')?'rotate(90deg)':'';
}

function updStats(){
  const wsSet=new Set();
  Object.keys(RES).forEach(function(k){const m=k.match(/_w(\d+)_s/);if(m)wsSet.add(m[1]);});
  document.getElementById('sW').textContent=wsSet.size||'–';
  const ds=Object.values(RES).map(function(r){return r&&r.date?r.date:null;}).filter(Boolean);
  document.getElementById('sD').textContent=ds.length?ds[ds.length-1]:'–';
}

function clrAll(){
  if(!confirm('Wyczyścić wszystkie wyniki?')) return;
  Object.keys(RES).forEach(function(k){delete RES[k];});
  localStorage.removeItem('krt6v2');
  rProg();rPlan();showToast('🗑 Wyczyszczono');
}

function expCSV(){
  let c='\uFEFFĆwiczenie,Dzień,Tydzień,Seria,Ciężar (kg),Powtórzenia,Data\n';
  EX.forEach(function(e){
    if(e.isCore||e.type==='cardio') return;
    for(let w=1;w<=5;w++){
      const n=parseInt(e.weeks[w-1].s)||1;
      for(let s=1;s<=n;s++){
        const k=sk(e.id,w,s),r=RES[k];
        if(r&&(r.kg||r.reps)) c+='"'+e.name+'","'+e.day+'","T'+w+'","S'+s+'","'+(r.kg||'')+'","'+(r.reps||'')+'","'+(r.date||'')+'"\n';
      }
    }
  });
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([c],{type:'text/csv;charset=utf-8;'}));
  a.download='KrzempiK_Trening_v2.csv';a.click();
  showToast('📥 CSV gotowy');
}

function expJSON(){
  const payload={krt6v2:RES,exportedAt:new Date().toISOString(),version:'krt6v2'};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  const d=new Date();
  a.download='KrzempiK_Trening_v2_'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.json';
  a.click();
  showToast('✅ Dane wyeksportowane');
}

function impJSON(){
  document.getElementById('jsonFileInput').value='';
  document.getElementById('jsonFileInput').click();
}

function loadJSONFile(ev){
  const file=ev.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const obj=JSON.parse(e.target.result);
      const data=obj.krt6v2||obj.krt6||obj;
      if(typeof data!=='object'||Array.isArray(data)) throw new Error('Nieprawidłowy format');
      if(!confirm('Wczytać dane z pliku? Zastąpią obecne wyniki.')) return;
      Object.keys(RES).forEach(function(k){delete RES[k];});
      Object.keys(data).forEach(function(k){RES[k]=data[k];});
      localStorage.setItem('krt6v2',JSON.stringify(RES));
      rProg();rPlan();
      showToast('✅ Dane wczytane pomyślnie');
    }catch(err){
      alert('Błąd wczytywania pliku:\n'+err.message);
    }
  };
  reader.readAsText(file);
}

// ── POMIARY ──
function rPomiary(){
  document.getElementById('pomiaBlocks').innerHTML=PM_FIELDS.map(function(f){
    const weekCols=[1,2,3,4,5].map(function(w){
      const r=RES[pmKey(f.id,w)]||{};
      const hasVal=!!r.val;
      let tr='';
      if(w>1){
        const pr=RES[pmKey(f.id,w-1)]||{};
        if(r.val&&pr.val){
          const d=parseFloat(r.val)-parseFloat(pr.val);
          if(!isNaN(d)) tr=d>0?'<span class="tu">↑</span>':d<0?'<span class="td2">↓</span>':'<span style="color:var(--tx3)">→</span>';
        }
      }
      return '<div style="flex:1;min-width:0;text-align:center">'
        +'<div style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--tx3);letter-spacing:.04em;margin-bottom:4px">T'+w+'</div>'
        +'<div style="position:relative">'
        +'<input type="number" min="0" step="'+(f.unit==='kg'?'0.1':'0.5')+'" inputmode="decimal"'
        +' placeholder="–" value="'+(r.val||'')+'"'
        +' class="r-inp'+(hasVal?' f':'')+'"'
        +' style="width:100%;text-align:center;padding:7px 2px;font-size:14px"'
        +' onchange="savePm(\''+f.id+'\','+w+',this)">'
        +(tr?'<span style="position:absolute;top:1px;right:2px;font-size:10px">'+tr+'</span>':'')
        +'</div>'
        +'<div style="font-size:10px;color:var(--tx3);margin-top:2px">'+f.unit+'</div></div>';
    }).join('');

    const summary=[1,2,3,4,5].map(function(w){
      const r=RES[pmKey(f.id,w)];
      return r?'T'+w+': '+r.val+' '+f.unit:null;
    }).filter(Boolean).join(' · ')||'Brak danych';

    return '<div class="db" id="pm-'+f.id+'">'
      +'<div class="dbh" onclick="togPm(\''+f.id+'\')">'
      +'<div class="di push" style="font-size:20px">'+f.icon+'</div>'
      +'<div style="flex:1"><div class="dt">'+f.label+'</div>'
      +'<div class="dm">'+summary+'</div></div>'
      +'<span class="dc">›</span></div>'
      +'<div class="dbd" style="padding:1rem">'
      +'<div style="display:flex;gap:6px">'+weekCols+'</div>'
      +'</div></div>';
  }).join('');
}

function togPm(id){
  const b=document.getElementById('pm-'+id);
  b.classList.toggle('open');
  b.querySelector('.dc').style.transform=b.classList.contains('open')?'rotate(90deg)':'';
}
